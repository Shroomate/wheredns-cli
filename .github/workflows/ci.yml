name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - name: Loopback regressions
        if: runner.os == 'Linux'
        run: |
          python3 tests/loopback_regressions.py
          python3 tests/dns_eligibility.py
      - run: cargo build --locked --release
      - name: PowerShell module smoke tests
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './target/release/wheredns.exe' } else { './target/release/wheredns' }
          ./powershell/test-module.ps1 -BinaryPath $binary
      - name: Windows PowerShell 5.1 module smoke tests
        if: runner.os == 'Windows'
        shell: powershell
        run: ./powershell/test-module.ps1 -BinaryPath ./target/release/wheredns.exe
      - name: Module packaging tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s powershell -p 'test_*.py'

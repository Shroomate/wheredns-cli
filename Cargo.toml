[package]
name = "wheredns"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local network diagnostics"
[dependencies]
rand = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.dev]
debug = 0
incremental = false
[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "net", "time", "signal", "process", "io-util", "sync"]
[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls", "json", "stream"]
[dependencies.hickory-proto]
version = "0.24"
[dependencies.futures-util]
version = "0.3"

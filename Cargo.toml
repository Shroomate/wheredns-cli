[package]
name = "wheredns"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "DNS, email, web and network diagnostics from the terminal"
repository = "https://github.com/Shroomate/wheredns-cli"
readme = "README.md"
keywords = ["dns", "email", "diagnostics", "network", "cli"]
categories = ["command-line-utilities", "network-programming"]
[dependencies]
rand = "0.10"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
textwrap = { version = "0.16.2", default-features = false, features = ["terminal_size", "unicode-width"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ring = "0.17"
httparse = "1"
x509-parser = "0.18"
terminal_size = "0.4"
[profile.dev]
debug = 0
incremental = false
[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "net", "time", "signal", "process", "io-util", "sync"]
[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls", "json", "stream"]
[dependencies.hickory-proto]
version = "0.26.1"
[dependencies.futures-util]
version = "0.3"
